# Solo para desarrollo: Postgres en el puerto 5433 (el 5432 suele estar ocupado).
# Nombre de proyecto propio: si compartiera "passme" con docker-compose.yml, Docker trataría las dos
# bases como el mismo servicio y levantar una reemplazaría a la otra.
name: passme-dev

services:
  dev-db:
    image: postgres:17-alpine
    container_name: passme_dev_db
    environment:
      POSTGRES_DB: passme
      POSTGRES_USER: passme
      POSTGRES_PASSWORD: passme-dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - passme-dev-db:/var/lib/postgresql/data

volumes:
  passme-dev-db:
