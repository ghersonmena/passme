# IP real del cliente: detrás de un túnel de Cloudflare viene en CF-Connecting-IP; si no, es la
# dirección de la conexión. La API la usa para el límite de intentos por IP.
map $http_cf_connecting_ip $passme_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se reemplaza (no se agrega) para que el cliente no pueda inyectar una IP falsa
        proxy_set_header X-Forwarded-For $passme_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker y el manifiesto se revisan en cada visita para recibir actualizaciones
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
