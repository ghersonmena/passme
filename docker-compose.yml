# PassMe en producción. Antes del primer arranque: ./scripts/setup.sh (crea .env con secretos)
services:
  db:
    image: postgres:17-alpine
    container_name: passme_db
    environment:
      POSTGRES_DB: passme
      POSTGRES_USER: passme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passme -d passme"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: passme_api
    environment:
      DATABASE_URL: postgres://passme:${POSTGRES_PASSWORD}@db:5432/passme
      SERVER_SECRET: ${SERVER_SECRET:?Falta SERVER_SECRET en .env}
      REGISTRATION: ${REGISTRATION:-closed}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      TRUST_PROXY: 1
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: passme_web
    ports:
      - "${PASSME_PORT:-4040}:443"
    environment:
      PASSME_CERT_CN: ${PASSME_CERT_CN:-passme.local}
    volumes:
      # Certificado: si la carpeta está vacía se genera uno autofirmado al arrancar
      - ./certs:/etc/nginx/certs
    depends_on: [api]
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
